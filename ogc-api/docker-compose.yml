name: ogc-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ogc-api:local
    restart: unless-stopped

    # Bound to the loopback interface by default so the container is not
    # exposed on the network until you put a TLS-terminating reverse proxy in
    # front of it. Set API_BIND=0.0.0.0 to publish it directly.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"

    # See the Configuration table in README.md. Override via a .env file next
    # to this one, or in the shell.
    environment:
      PORT: "8080"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
      JOB_MAX_AGE_HOURS: "${JOB_MAX_AGE_HOURS:-48}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      PDOK_BAG_WFS_URL: "${PDOK_BAG_WFS_URL:-https://service.pdok.nl/lv/bag/wfs/v2_0}"

    # The server writes nothing to disk — jobs live in memory — so the whole
    # filesystem can be read-only. /tmp is a small tmpfs for Go's own use.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # A runaway PDOK query should not take the host down with it.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
